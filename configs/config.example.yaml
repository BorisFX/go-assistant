mode: server  # server | local

# IANA timezone for clock-time cron schedules like "daily at 09:00".
timezone: "UTC"

telegram:
  token: ${TELEGRAM_TOKEN}
  owner_id: 123456789
  stream_mode: "partial"
  polling_watchdog_timeout: 120s
  debounce_delay: 500ms
  media_group_window: 500ms

llm:
  chat:
    provider: openrouter
    model: "google/gemini-3.6-flash"
    fallback: "deepseek/deepseek-v4-pro"
    api_key: ${OPENROUTER_KEY}
  embedding:
    provider: openrouter
    model: "openai/text-embedding-3-small"
  # Model used when a message contains images. Must be vision-capable.
  vision:
    provider: openrouter
    model: "google/gemini-2.5-flash"

database:
  host: localhost
  port: 5432
  name: assistant
  user: assistant
  password: ${DB_PASSWORD}

search:
  # Tavily is the primary web-search provider (LLM-native: dated, ranked results
  # with a freshness filter). Get a key at https://tavily.com. Leave api_key empty
  # to fall back to SearXNG/DuckDuckGo.
  tavily:
    api_key: ${TAVILY_KEY}
    # endpoint: ""   # optional; defaults to https://api.tavily.com/search
  # Fallback meta-search. Used when Tavily is unconfigured or fails.
  searxng_url: "http://localhost:8888"

trading:
  cryptoai_url: "http://localhost:5154"
  cryptoai_key: ${CRYPTOAI_KEY}
  poll_interval: 5m

budget:
  monthly_limit: 5.00
  alert_threshold: 0.8

dashboard:
  port: 8080
  api_key: ${DASHBOARD_KEY}
  domain: "assistant.khmertech.dev"

code:
  binary: "claude"
  default_dir: "~/Programming"

# Obsidian vault integration — set vault_dir to enable the `obsidian` tool.
# Leave empty to disable (e.g. on instances that should not see the vault).
obsidian:
  vault_dir: ""   # absolute path to the synced vault, e.g. /root/Obsidian/Oleg

# Google Workspace — set credentials_file to enable the Drive/Sheets/Gmail tools.
# Leave empty to disable. Requires a service account added as a member of the
# shared drive; Gmail additionally requires domain-wide delegation, and then
# impersonate must name the mailbox to act as.
google:
  credentials_file: ""            # path to the service account JSON key
  impersonate: ""                 # mailbox to act as; required only for Gmail
  drive:
    root_folder_id: ""            # shared drive id
  sheets:
    registry_id: ""               # project registry spreadsheet id
    registry_sheet: "Проекты"
  gmail:
    enabled: false
    processed_label: "Обработано"
    poll_interval: 15m

memory:
  fact_extraction_interval: 6          # extract facts every N messages
  extraction_model: "deepseek/deepseek-v4-flash"
  similarity_threshold: 0.45           # max cosine distance for RAG matches
  dedup_threshold: 0.15                # skip facts nearer than this to an existing one
